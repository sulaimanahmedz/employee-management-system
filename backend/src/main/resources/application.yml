spring:
  application:
    name: employee-management-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/employees}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
